<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Sri Amman Supermarket</title>
  <style>
    :root {
      --brand-primary: #76CA3E;
      --brand-forest: #143B0D;
      --brand-cream: #F8FAF7;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--brand-cream);
      color: #0F172A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 1.5rem;
      padding: 2.25rem 1.75rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 4px 20px -2px rgba(20, 59, 13, 0.08);
    }
    .icon-badge {
      width: 4.5rem;
      height: 4.5rem;
      background: #F1F9EC;
      color: var(--brand-forest);
      border-radius: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--brand-forest);
      line-height: 1.25;
      margin-bottom: 0.35rem;
    }
    h2 {
      font-size: 1rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 0.875rem;
      color: #64748B;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: var(--brand-primary);
      color: #143B0D;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 0.85rem 1.5rem;
      border-radius: 1rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(118, 202, 62, 0.3);
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .btn-retry:active {
      transform: scale(0.98);
    }
    .contact-box {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px dashed #CBD5E1;
      font-size: 0.8125rem;
      color: #334155;
      text-align: left;
    }
    .contact-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.5rem;
    }
    .contact-link {
      color: #047857;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-badge">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You're Currently Offline</h1>
    <h2>நீங்கள் ஆஃப்லைனில் உள்ளீர்கள்</h2>
    <p>
      Please check your network connection. We will restore your active shopping cart as soon as you are reconnected.
    </p>

    <button class="btn-retry" onclick="window.location.reload()">
      Retry Connection • மீண்டும் முயற்சிக்கவும்
    </button>

    <div class="contact-box">
      <strong>Need Urgent Assistance?</strong>
      <div class="contact-row">
        <span>Store Phone:</span>
        <a class="contact-link" href="tel:+919876543210">+91 98765 43210</a>
      </div>
      <div class="contact-row">
        <span>Madurai Support:</span>
        <a class="contact-link" href="mailto:sriammansupermarket@gmail.com">sriammansupermarket@gmail.com</a>
      </div>
    </div>
  </div>
</body>
</html>
